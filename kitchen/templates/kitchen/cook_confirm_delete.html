{% extends "base.html" %}

{% block content %}
  <h1>Delete Cook</h1>

  <p>Are you sure you want to delete {{ object.username }}?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
  </form>

  <a href="{% url 'kitchen:cook-list' %}">Cancel</a>
{% endblock %}
