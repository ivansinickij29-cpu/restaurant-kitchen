{% extends "base.html" %}

{% block content %}
  <h1>{{ dish.name }}</h1>
  <p>Description: {{ dish.description }}</p>
  <p>Price: {{ dish.price }}</p>
  <p>Dish type: {{ dish.dish_type }}</p>

  <h2>Cooks:</h2>
  {% for cook in dish.cooks.all %}
    <p>{{ cook.username }}</p>
  {% empty %}
    <p>No cooks assigned</p>
  {% endfor %}
{% endblock %}
