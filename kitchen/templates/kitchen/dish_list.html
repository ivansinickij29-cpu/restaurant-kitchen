{% extends "base.html" %}

{% block content %}
    <h1>Dish List</h1>
  <a href="{% url 'kitchen:dish-create' %}">
  Add new dish
</a>
  <form method="get">
  <input
  type="text"
  name="name"
  placeholder="Search dishes"
  value="{{ request.GET.name }}"
  >
  <button type="submit">Search</button>
  </form>

    {% for dish in object_list %}
  <p>
    <a href="{% url 'kitchen:dish-detail' dish.pk %}">
      {{ dish.name }}
    </a>
    - {{ dish.price }}
  </p>
{% empty %}
  <p>No dishes available</p>
{% endfor %}
  {% include "includes/pagination.html" %}
{% endblock %}
