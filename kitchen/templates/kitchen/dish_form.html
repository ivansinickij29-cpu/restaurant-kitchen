
{% extends "base.html" %}

{% block content %}

<div class="container py-5">
  <div class="card shadow-lg border-radius-xl border-0">
    <div class="card-body p-4 p-md-5">

      {% if object %}
        <h1>Update Dish</h1>
      {% else %}
        <h1>Create Dish</h1>
      {% endif %}

      <form method="post" class="dish-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn bg-gradient-primary"
                type="submit">
          Save
        </button>
      </form>

    </div> <!-- card-body -->
  </div> <!-- card -->
</div> <!-- container -->
<style>
  .dish-form textarea {
    width: 100%;
    height: 120px;
  }
  .dish-form > p {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}
  .dish-form {
    max-width: 750px;
}
  .dish-form input,
.dish-form textarea,
.dish-form select {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
}
</style>
{% endblock %}
