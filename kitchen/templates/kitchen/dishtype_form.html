{% extends "base.html" %}

{% block content %}
  {% if object %}
  <h1>Update Dish Type</h1>
{% else %}
  <h1>Create Dish Type</h1>
{% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

  <a href="{% url 'kitchen:dish-type-list' %}">
    Back to list
  </a>
{% endblock %}
